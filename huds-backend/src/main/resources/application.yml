spring:
  application:
    name: huds-backend

  profiles:
    default: local

  session:
    jdbc:
      initialize-schema: never # table creation is handled by Flyway
      timeout: 1800 # 30 minutes

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/huds}
    username: ${DB_USERNAME:huds}
    password: ${DB_PASSWORD:huds_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: HADS_SESSION #prod environment should change to __Host-HUDS_SESSION
        http-only: true
        secure: false #prod environment should change to true
        same-site: strict
        path: /
huds:
  auth:
    max-failed-login-attempts: 5
    lock-duration: 15m
    destroy-idle-timeout: 30m
    destroy-absolute-duration: 12h
    mobile-idle-timeout: 24h
    mobile-absolute-duration: 14h
    ip-failure-limit: 30
    ip-failure-window: 10m
    cookie-secure: false #prod environment should change to true

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: HADS Backend
    description: Hugo's Appliance Diagnostic System API

logging:
  level:
    root: INFO
    com.hugo.huds: INFO
    org.springframework.security: INFO